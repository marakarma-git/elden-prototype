<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA Footer Section (Responsive)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #000000;
            --color-text-primary: #ffffff;
        }

        body {
            /* Hanya untuk demo, agar kontras */
            background-color: #f0f0f0; 
        }

        /* === CTA Footer Section === */
        .cta-footer-audience {
            /* Latar belakang gelap dengan gambar audiens */
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                              url('https://images.unsplash.com/photo-1511578314322-379afb476865?q=80&w=2069&auto-format&fit=crop');
            background-color: var(--color-bg-dark);
            background-size: cover;
            background-position: center;
            
            /* === PERUBAHAN KETINGGIAN DI SINI === */
            padding: 10rem 0; /* Diubah dari 7rem agar lebih tinggi */
            
            color: var(--color-text-primary);
            position: relative;
            text-align: center;
        }
        
        /* Judul "Make it genuine." */
        .cta-title {
            font-family: var(--font-serif);
            font-size: clamp(2.25rem, 6vw, 3.25rem); 
            font-weight: 400; /* Regular */
            color: var(--color-text-primary);
            line-height: 1.2;
            margin-bottom: 2.5rem; /* Jarak ke tombol */
        }

        /* Tombol "Consult Now!" */
        .btn-consult-footer {
            font-family: var(--font-sans);
            font-weight: 400; /* Regular */
            font-size: 1rem;
            color: var(--color-text-primary);
            background-color: transparent;
            border: 2px solid var(--color-text-primary);
            border-radius: 50px; 
            padding: 0.75rem 2.5rem; 
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        /* Efek Hover */
        .btn-consult-footer:hover {
            color: var(--color-bg-dark);
            background-color: var(--color-text-primary);
        }

    </style>
</head>
<body>

    <footer>
        <section class="cta-footer-audience">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10">
                        
                        <h2 class="cta-title">
                            Make it genuine.
                        </h2>
                        
                        <a href="#" class="btn-consult-footer">
                            Consult Now!
                        </a>

                    </div>
                </div>
            </div>
        </section>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
