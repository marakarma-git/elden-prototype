<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elden Hero Section - Network</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #02040a; /* Latar belakang biru sangat gelap */
            --color-text-primary: #ffffff;
            --color-text-secondary: #a0a0a0; /* Abu-abu pudar */
        }

        body {
            background-color: var(--color-bg-dark);
        }

        /* === Hero Section === */
        .hero-section {
            /* Menggunakan tinggi 100% viewport */
            min-height: 100vh; 
            width: 100%;
            color: var(--color-text-primary);
            position: relative;
            
            /* Latar belakang berlapis (sama seperti sebelumnya) */
            background-image: 
                linear-gradient(rgba(2, 4, 10, 0.5), rgba(2, 4, 10, 0.5)),
                url('https://images.pexels.com/photos/1809605/pexels-photo-1809605.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'),
                url('https://images.unsplash.com/photo-1504333638930-c8787321e06e?q=80&w=2070&auto=format&fit=crop');
            
            background-size: cover, cover, cover;
            background-position: center, center, center;
            background-blend-mode: overlay, screen;

            /* Menggunakan Flexbox untuk menata logo, konten, dan footer */
            display: flex;
            flex-direction: column;
        }

        /* 1. Logo di Atas */
        .hero-logo {
            font-family: var(--font-sans);
            font-weight: 400;
            font-size: 1.25rem;
            padding: 2.5rem 0; /* Jarak dari atas */
            letter-spacing: 1px;
        }

        /* 2. Konten Utama di Tengah */
        .hero-content {
            flex-grow: 1; /* Mendorong footer ke bawah */
        }
        
        .hero-pretitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Wrapper untuk 'Network' dan 'you'll ever need' */
        .hero-title-cluster {
            position: relative;
            display: inline-block; /* Agar lebarnya pas dengan 'Network' */
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 10vw, 7.5rem); /* Ukuran font responsif */
            font-weight: 500;
            line-height: 1.1;
            color: var(--color-text-primary);
        }
        
        /* Teks "you'll ever need" */
        .hero-subtitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            
            /* Kunci Posisi: */
            position: absolute;
            top: 55%; /* Posisikan 55% dari atas cluster */
            left: 102%; /* Posisikan 102% dari kiri cluster (di luar) */
            width: 200px; /* Beri lebar agar tidak wrap */
            text-align: left;
        }
        
        /* 3. Footer Teks di Bawah */
        .hero-footer-text {
            font-family: var(--font-sans);
            font-size: 1rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        
        /* Penyesuaian untuk layar kecil */
        @media (max-width: 768px) {
            .hero-subtitle {
                /* Di layar kecil, pindahkan ke bawah 'Network' */
                position: static;
                width: auto;
                text-align: center;
                margin-top: 0.5rem;
            }
            
            .hero-footer-text {
                font-size: 0.9rem;
            }
        }

    </style>
</head>
<body>

    <section class="hero-section">
        
        <header class="hero-logo text-center">
            <strong>Elden</strong>
        </header>

        <main class="container hero-content d-flex align-items-center justify-content-center">
            <div class="text-center">
                
                <p class="hero-pretitle">One and only</p>
                
                <div class="hero-title-cluster">
                    <h1 class="hero-title">Network</h1>
                    <span class="hero-subtitle">you'll ever need</span>
                </div>

            </div>
        </main>

        <footer class="container-fluid p-4 p-md-5">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-10 text-center">
                    <div class="hero-footer-text">
                        <p>
                            Elden is a strategic partner for businesses that want to grow fast, connect with audiences on an emotional level, and maximize the potential of digital content.
                        </p>
                    </div>
                </div>
            </div>
        </footer>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
