<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Plan Section</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        /* CSS Kustom */
        .growth-plan-section {
            /* Ganti 'path/to/background-image.jpg' dengan path gambar Anda 
              (Contoh: nama file 'image_6dca44.jpg' yang Anda unggah pertama kali)
            */
            background-image: url('../../landing/img/FOTO/gradient.png');
            
            /* Properti tambahan untuk background image */
            background-size: cover;       /* Memastikan gambar menutupi seluruh section */
            background-position: center;  /* Memposisikan gambar di tengah */
            background-repeat: no-repeat; /* Mencegah gambar berulang */
            
            /* Warna fallback (jaga-jaga jika gambar gagal dimuat) */
            background-color: #1a2035; 
            
            color: #ffffff;
            padding: 6rem 0; /* Memberi padding atas dan bawah yang cukup */
        }

        .growth-plan-section h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        .growth-plan-section p {
            font-family: 'Lato', sans-serif;
            opacity: 0.9;
        }

        .elden-logo {
            height: 45px; /* Anda bisa ubah nilainya */
            width: auto;
        }

        .social-icon {
            height: 120px; /* Anda bisa ubah nilainya */
            width: 120px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <section class="growth-plan-section">
        <div class="container">
            <div class="row mb-5 pb-5">
                <div class="col-lg-8 col-md-10">
                    <h1 class="display-3">Discuss your growth plan!</h1>
                    <p class="lead mt-3">
                        We'll be happy to assist you in developing a marketing plan that aligns with your goals and drives measurable results
                    </p>
                </div>
            </div>

            <div class="row align-items-center mt-5">
                
                <div class="col-12 col-md-6 text-center text-md-start mb-4 mb-md-0">
                    <img src="path/to/elden-logo.png" alt="Elden Logo" class="elden-logo">
                </div>

                <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end align-items-center gap-3">
                    
                    <a href="#" aria-label="WhatsApp">
                        <img src="../../landing/img/ICONS/6.png" alt="WhatsApp" class="social-icon">
                    </a>
                    
                    <a href="#" aria-label="Instagram">
                        <img src="../../landing/img/ICONS/7.png" alt="Instagram" class="social-icon">
                    </a>
                    
                    <a href="#" aria-label="Email">
                        <img src="../../landing/img/ICONS/8.png" alt="Email" class="social-icon">
                    </a>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
