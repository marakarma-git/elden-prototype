<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA Footer Section (Responsive)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #05050a; /* Latar belakang sangat gelap */
            --color-text-primary: #ffffff;
        }

        body {
            /* Hanya untuk demo, agar kontras */
            background-color: #f0f0f0; 
        }

        /* === CTA Footer Section === */
        .cta-footer-strategy {
            /* Latar belakang gelap dengan gambar studio/vlogger */
            background-image: linear-gradient(rgba(5, 5, 10, 0.85), rgba(5, 5, 10, 0.85)), 
                              url('https://images.unsplash.com/photo-1598387993441-a364f854c3e1?q=80&w=1974&auto=format&fit=crop');
            background-color: var(--color-bg-dark);
            background-size: cover;
            background-position: center;
            
            padding: 7rem 0; 
            color: var(--color-text-primary);
            position: relative;
            text-align: center;
        }
        
        /* Judul "Want a Strategy..." */
        .cta-title {
            font-family: var(--font-serif);
            font-size: clamp(1.75rem, 5vw, 2.75rem); 
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: 2rem; 
            white-space: normal; /* Default: biarkan teks 'wrap' (turun baris) */
        }

        /* * Media Query untuk layar besar (Desktop)
         * 992px adalah breakpoint 'lg' di Bootstrap
        */
        @media (min-width: 992px) {
            .cta-title {
                white-space: nowrap; /* Paksa satu baris HANYA di layar besar */
            }
        }

        /* Tombol "Consult Now!" */
        .btn-consult-footer {
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 1rem;
            color: var(--color-text-primary);
            background-color: transparent;
            border: 2px solid var(--color-text-primary);
            border-radius: 50px; 
            padding: 0.75rem 2.5rem; 
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        /* Efek Hover */
        .btn-consult-footer:hover {
            color: var(--color-bg-dark);
            background-color: var(--color-text-primary);
        }

    </style>
</head>
<body>

    <footer>
        <section class="cta-footer-strategy">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        
                        <h2 class="cta-title">
                            Want a Strategy That Truly Drives Growth?
                        </h2>
                        
                        <a href="#" class="btn-consult-footer">
                            Consult Now!
                        </a>

                    </div>
                </div>
            </div>
        </section>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
