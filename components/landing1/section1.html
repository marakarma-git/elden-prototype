<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elden Hero Section</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* Impor Font Kustom "The Seasons" */
        @font-face {
            font-family: 'The Seasons';
            /* GANTI PATH INI ke file font Anda */
            src: url('fonts/TheSeasons-Regular.woff2') format('woff2'),
                 url('fonts/TheSeasons-Regular.woff') format('woff');
            font-weight: 500; 
            font-style: normal;
        }

        :root {
            --font-serif: 'The Seasons', serif;
            --font-sans: 'Inter', sans-serif;
            --color-bg-dark: #02040a; 
            --color-text-primary: #ffffff;
            --color-text-secondary: #a0a0a0;
        }

        body {
            background-color: var(--color-bg-dark);
        }

        /* === Hero Section === */
        .hero-section {
            min-height: 100vh; 
            width: 100%;
            color: var(--color-text-primary);
            position: relative;
            
            background-image: 
                linear-gradient(rgba(2, 4, 10, 0.5), rgba(2, 4, 10, 0.5)),
                url('https://images.pexels.com/photos/1809605/pexels-photo-1809605.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1'),
                url('https://images.unsplash.com/photo-1504333638930-c8787321e06e?q=80&w=2070&auto=format&fit=crop');
            
            background-size: cover, cover, cover;
            background-position: center, center, center;
            background-blend-mode: overlay, screen;

            display: flex;
            flex-direction: column;
        }

        /* 1. Logo di Atas */
        .hero-logo {
            /* Styling font-family, font-weight, dll. dihapus */
            padding: 2.5rem 0; /* Jarak dari atas tetap ada */
        }

        /* 2. Konten Utama di Tengah */
        .hero-content {
            flex-grow: 1; 
        }
        
        .hero-pretitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(3.5rem, 9vw, 6.5rem); 
            font-weight: 500;
            line-height: 1.1;
            color: var(--color-text-primary);
        }
        
        /* 3. Footer Teks di Bawah */
        .hero-footer-text {
            font-family: var(--font-sans);
            font-size: 1rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        
    </style>
</head>
<body>

    <section class="hero-section">
        
        <header class="hero-logo text-center">
            <img src="path/ke/logo-elden-putih.png" alt="Elden Logo" style="height: 24px; width: auto;">
        </header>
        <main class="container hero-content d-flex align-items-center justify-content-center">
            <div class="text-center">
                
                <p class="hero-pretitle">Stop making</p>
                
                <h1 class="hero-title">
                    Contents
                </h1>
                
                <p class="hero-pretitle mt-4">Start making</p>
                
                <h1 class="hero-title">Connection</h1>

            </div>
        </main>

        <footer class="container-fluid p-4 p-md-5">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8 text-center">
                    <div class="hero-footer-text">
                        <p>
                            Using our growth formula, we turn creativity into conversions. Content & ad strategies designed for maximum ROAS.
                        </p>
                    </div>
                </div>
            </div>
        </footer>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
