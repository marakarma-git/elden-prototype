<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title Section</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    /* CSS Kustom */
    .title-main {
      /* Menggunakan font Playfair Display yang diimpor */
      font-family: 'Playfair Display', serif;
      /* Anda bisa sesuaikan ukurannya */
      font-size: 8rem; 
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
    }

    .title-sub {
      /* Font sans-serif standar untuk teks pendukung */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.75rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Penyesuaian untuk layar mobile */
    @media (max-width: 768px) {
      .title-main {
        font-size: 5rem; /* Kecilkan font di HP */
      }
      .title-sub {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body class="bg-dark">

  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    
    <div class="w-100" style="max-width: 700px;">
      <div class="d-flex flex-column">
        
        <span class="title-sub">
          One and only
        </span>
        
        <h1 class="title-main my-n2">
          Network
        </h1>
        
        <span class="title-sub align-self-end">
          you'll ever need
        </span>
        
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
