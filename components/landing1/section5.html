<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elden Footer Section (Tinggi 90vh)</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    /* Mengatur body agar konten bisa memenuhi layar */
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-color: #000;
      color: #ffffff;
    }

    /* Mengganti .hero-section menjadi .site-footer */
    .site-footer {
      /* Ganti URL ini dengan path ke gambar latar belakang Anda */
      background-image: url('https://images.unsplash.com/photo-1504333638930-c8787321e06e?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center center;
      position: relative;
      
      /* KETINGGIAN DIATUR DI SINI:
        Diubah dari 100vh menjadi 90vh (90% tinggi layar).
        Anda bisa ganti ke nilai lain (misal: 80vh, 700px, dll)
      */
      min-height: 90vh; 
      
      display: flex;
      flex-direction: column;
    }

    .site-footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85); 
      z-index: 1;
    }

    .site-footer .container-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      
      /* KETINGGIAN DIATUR DI SINI:
        Nilai ini harus sama dengan .site-footer
      */
      min-height: 90vh; 
      
      width: 100%;
      padding-right: var(--bs-gutter-x, 0.75rem);
      padding-left: var(--bs-gutter-x, 0.75rem);
      margin-right: auto;
      margin-left: auto;
    }
    
    /* Atur max-width untuk .container-inner agar sama seperti .container */
    @media (min-width: 576px) { .site-footer .container-inner { max-width: 540px; } }
    @media (min-width: 768px) { .site-footer .container-inner { max-width: 720px; } }
    @media (min-width: 992px) { .site-footer .container-inner { max-width: 960px; } }
    @media (min-width: 1200px) { .site-footer .container-inner { max-width: 1140px; } }
    @media (min-width: 1400px) { .site-footer .container-inner { max-width: 1320px; } }
    
    
    .footer-logo {
      height: 24px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .footer-content-main {
      flex-grow: 1;
    }

    .title-main {
      font-family: 'Playfair Display', serif;
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
    }

    .title-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.75rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .footer-caption {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Penyesuaian untuk layar mobile */
    @media (max-width: 768px) {
      .title-main {
        font-size: 4rem;
      }
      .title-sub {
        font-size: 1.25rem;
      }
      .footer-caption {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <footer class="site-footer">
    
    <div class="container-inner">

      <nav class="py-4 text-center">
        <img src="https://via.placeholder.com/100x30/000000/000000?text=Elden" alt="Elden Logo" class="footer-logo">
      </nav>

      <main class="footer-content-main d-flex align-items-center justify-content-center">
        <div style="max-width: 700px;">
          <div class="d-flex flex-column">
            
            <span class="title-sub">
              One and only
            </span>
            
            <h1 class="title-main my-n2">
              Network
            </h1>
            
            <span class="title-sub align-self-end">
              you'll ever need
            </span>
            
          </div>
        </div>
      </main>

      <div class="footer-bottom py-4 text-center">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <p class="footer-caption">
              Elden is a strategic partner for businesses that want to grow fast, connect with audiences on an emotional level, and maximize the potential of digital content.
            </p>
          </div>
        </div>
      </div>

    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
