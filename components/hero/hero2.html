<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Authentic Content</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #05050a; /* Latar belakang sangat gelap */
            --color-text-primary: #ffffff;
            --color-text-secondary: #c0c0c0; /* Abu-abu muda */
        }

        body {
            background-color: var(--color-bg-dark);
        }

        /* === Hero Section === */
        .hero-section {
            /* Menggunakan gambar latar belakang grafik data yang gelap */
            /* Placeholder dari Unsplash */
            background-image: linear-gradient(rgba(5, 5, 10, 0.9), rgba(5, 5, 10, 0.9)), 
                              url('https://images.unsplash.com/photo-1611605698335-8b1569810432?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            
            padding: 8rem 0;
            position: relative;
            color: var(--color-text-primary);
        }
        
        /* Teks "We design" */
        .hero-pretitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Judul utama "Authentic Content..." */
        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 7vw, 5.5rem); /* Ukuran font responsif */
            font-weight: 600; /* Sedikit tebal */
            line-height: 1.15;
            color: var(--color-text-primary);
            margin-bottom: 1.5rem;
        }
        
        /* Subjudul "that turn viewers..." */
        .hero-subtitle {
            font-family: var(--font-sans);
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            color: var(--color-text-secondary);
            font-weight: 300; /* Tipis */
            max-width: 600px; /* Batasi lebar agar tidak terlalu panjang */
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

    </style>
</head>
<body>

    <section class="hero-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9 text-center">
                    
                    <p class="hero-pretitle">We design</p>
                    
                    <h1 class="hero-title">
                        Authentic Content and<br>
                        Precision Ad Strategies
                    </h1>
                    
                    <p class="hero-subtitle">
                        that turn viewers into loyal customers for D2C brands.
                    </p>

                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
