<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Insight and Outside</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #000000;
            --color-text-primary: #ffffff;
            --color-text-secondary: #c0c0c0; /* Abu-abu muda */
        }

        body {
            background-color: var(--color-bg-dark);
        }

        /* === Hero Section === */
        .hero-insight {
            /* Latar belakang gelap dengan gambar studio/vlogger */
            /* Placeholder dari Unsplash */
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                              url('https://images.unsplash.com/photo-1598387993441-a364f854c3e1?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            
            padding: 10rem 0; /* Memberi ruang vertikal yang besar */
            color: var(--color-text-primary);
            position: relative;
        }
        
        /* Teks "Making contents that's" */
        .hero-pretitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        /* Judul utama "Beauty from the..." */
        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(3.2rem, 8vw, 6rem); /* Ukuran font responsif */
            font-weight: 500; /* Medium */
            line-height: 1.15;
            color: var(--color-text-primary);
        }
        
        /* Style untuk garis bawah kustom */
        .underlined {
            /* Menggunakan border-bottom untuk garis tebal */
            border-bottom: 4px solid var(--color-text-primary);
            /* Padding agar garis tidak terlalu mepet */
            padding-bottom: 0.3rem; 
        }

    </style>
</head>
<body>

    <section class="hero-insight">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9 text-center">
                    
                    <p class="hero-pretitle">Making contents that's</p>
                    
                    <h1 class="hero-title">
                        Beauty from the<br>
                        <span class="underlined">insight</span> and <span class="underlined">outside</span>
                    </h1>

                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
