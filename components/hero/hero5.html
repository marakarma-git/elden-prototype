<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Authentic Ideas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,400,0;9..144,400,1;9..144,600,0&family=Inter:wght@400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Font Families */
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
            
            /* Colors */
            --color-bg-dark: #000000;
            --color-text-primary: #ffffff;
            --color-text-secondary: #e0e0e0; /* Putih pudar */
        }

        body {
            background-color: var(--color-bg-dark);
            color: var(--color-text-primary);
        }

        /* === Hero Section === */
        .hero-authentic {
            background-color: var(--color-bg-dark);
            padding: 10rem 0; /* Memberi ruang vertikal yang besar */
            overflow: hidden; /* Mencegah horizontal scroll */
        }
        
        .hero-pretitle {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
            text-align: left; 
        }

        .hero-title-cluster {
            position: relative;
            display: inline-block; 
        }
        
        .cluster-wrapper {
            text-align: left;
        }

        .hero-title-authentic {
            font-family: var(--font-serif);
            font-size: clamp(5rem, 12vw, 9rem); 
            font-weight: 600; 
            line-height: 1.0;
            margin: 0;
            color: var(--color-text-primary);
        }
        
        .hero-subtitle-ideas {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 10vw, 7rem); 
            font-weight: 400; 
            font-style: italic; 
            line-height: 1.5;
            color: var(--color-text-primary);
            position: absolute;
            
            left: 97%;
            /* === PERUBAHAN UTAMA DI SINI === */
            /* Nilai 'top' ditambah agar posisi 'Ideas' lebih ke bawah */
            top: 4.5rem; /* <<< DIUBAH (sebelumnya 2rem) */
        }
        
        /* Penyesuaian untuk layar kecil */
        @media (max-width: 992px) {
            .hero-subtitle-ideas {
                left: 60%;
                top: 3.5rem; /* <<< DIUBAH (sebelumnya 1.5rem) */
            }
        }
        
        @media (max-width: 576px) {
             .hero-title-authentic { 
                font-size: 4rem; /* Kecilkan font di HP */
             }
             .hero-subtitle-ideas { 
                font-size: 3rem; /* 'Ideas' juga dikecilkan */
                left: 95%;
                top: 2.5rem; /* <<< DIUBAH (sebelumnya 2rem) */
             }
        }

    </style>
</head>
<body>

    <section class="hero-authentic">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    
                    <p class="hero-pretitle">We make sure that every thought, process, and step is an</p>
                    
                    <div class="cluster-wrapper">
                        <div class="hero-title-cluster">
                            <h1 class="hero-title-authentic">Authentic</h1>
                            <h2 class="hero-subtitle-ideas">Ideas</h2>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
