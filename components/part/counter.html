<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=The+Seasons&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'The Seasons', sans-serif;
        }
        .hero {
            background-color: #f4f4f4;
            padding: 80px 0;
            text-align: center;
        }
        .project, .brand {
            text-align: center;
            margin: 30px 0;
        }
        .project img, .brand img {
            width: 100%;
            height: auto;
        }
        .count-text {
            font-size: 50px;
            font-weight: bold;
            color: #333;
        }
        .sub-text {
            font-size: 20px;
            color: #666;
        }
        .project .card, .brand .card {
            border: none;
            background: transparent;
        }
        .project .card-body, .brand .card-body {
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Welcome to Our Portfolio</h1>
            <p>Explore our work across various industries</p>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="project">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/350x250" alt="Amanai" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">Amanai</h5>
                            <p class="sub-text">Food and Beverages</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/350x250" alt="Marbella Place" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">Marbella Place</h5>
                            <p class="sub-text">Hotel and Travel</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/350x250" alt="Polytron" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title">Polytron</h5>
                            <p class="sub-text">Technology</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats">
        <div class="container text-center">
            <div class="row">
                <div class="col-md-6">
                    <div class="count-text">65 ++</div>
                    <p class="sub-text">Projects Finished</p>
                </div>
                <div class="col-md-6">
                    <div class="count-text">31 ++</div>
                    <p class="sub-text">Brand Partners</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <section class="footer">
        <div class="container text-center">
            <p>&copy; 2025 Company. All rights reserved.</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
