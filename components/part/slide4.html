<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company and People Slider</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    /* Smooth scroll for entire page */
    html {
      scroll-behavior: smooth;
    }

    /* Space for content not to be hidden by fixed navbar */
    body {
      padding-top: 4.5rem;
    }

    /* Hero section */
    .hero {
      min-height: 85vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    /* Carousel item style */
    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Title style */
    h1 {
      font-size: 3rem;
      font-weight: bold;
    }
    
    /* Button styling */
    .btn-custom {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
    }

    .btn-custom:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color: #fff;">
  <div class="container">
    <a class="navbar-brand" href="#">We Connect</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section class="hero">
  <div class="container">
    <h1>We connect Company and People</h1>
    <p>We’ve successfully helped these brands grow their business.</p>

    <!-- Carousel -->
    <div id="brandCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://via.placeholder.com/800x400?text=Amanaiya" class="d-block w-100" alt="Amanaiya">
          <div class="carousel-caption d-none d-md-block">
            <h5>Amanaiya</h5>
            <p>Food and Beverages</p>
            <a href="#" class="btn btn-custom">Learn More</a>
          </div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/800x400?text=Marbella+Place" class="d-block w-100" alt="Marbella Place">
          <div class="carousel-caption d-none d-md-block">
            <h5>Marbella Place</h5>
            <p>Hotel and Travel</p>
            <a href="#" class="btn btn-custom">Learn More</a>
          </div>
        </div>
        <div class="carousel-item">
          <img src="https://via.placeholder.com/800x400?text=Polytron" class="d-block w-100" alt="Polytron">
          <div class="carousel-caption d-none d-md-block">
            <h5>Polytron</h5>
            <p>Technology</p>
            <a href="#" class="btn btn-custom">Learn More</a>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#brandCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#brandCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</section>

<!-- Bootstrap 5 JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
