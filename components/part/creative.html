<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill Feature – refined</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font serif mirip contoh -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --pill-radius: 40px;         /* sudut besar */
    --pill-pad-y: 26px;
    --pill-pad-x: 42px;
    --line: rgba(0,0,0,.6);      /* warna garis */
    --text: #0c0c0c;
    --muted: rgba(0,0,0,.6);
  }

  .feature-row{ position: relative; }
  .pill{
    position: relative;
    border:1px solid rgba(0,0,0,.25);
    border-radius: var(--pill-radius);
    padding: var(--pill-pad-y) var(--pill-pad-x);
    background:#fff;
    color: var(--text);
    overflow: visible;
  }
  .pill .title{
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(22px, 3.2vw, 36px);
    line-height: 1.05;
    margin: 0 0 6px 0;
  }
  .pill .sub{
    font-family: "Playfair Display", serif;
    font-size: clamp(12px, 1.6vw, 18px);
    color: var(--muted);
  }

  /* garis tipis horizontal yang memanjang keluar pill */
  .pill.line-right::after,
  .pill.line-left::before{
    content:"";
    position:absolute; top:0;
    height:1px; background: var(--line);
    transform: translateY(-18px); /* naik sedikit seperti contoh */
    width: 48%;
  }
  .pill.line-right::after{ right:-42%; }
  .pill.line-left::before{ left:-42%; }

  /* gambar overlap */
  .feat-img{
    width: clamp(110px, 16vw, 180px);
    filter: grayscale(100%);
    object-fit: contain;
  }
  .img-right{
    position: absolute; right: -6px; top: 50%;
    transform: translateY(-50%);
  }
  .img-left{
    position: absolute; left: -6px; top: 50%;
    transform: translateY(-50%);
  }

  /* responsif: di bawah lg, ikon pindah ke bawah agar rapi */
  @media (max-width: 991.98px){
    .img-right, .img-left{
      position: static; transform:none; margin-top: 10px;
      display:block; margin-left:auto; margin-right:auto;
    }
    .pill.line-right::after,
    .pill.line-left::before{ display:none; }
  }
</style>
</head>
<body class="bg-white">

<div class="container py-4 d-grid gap-4">

  <!-- 1. Creative Visual – ikon di kanan -->
  <div class="feature-row">
    <div class="pill line-right text-lg-start text-center">
      <div class="title">Creative Visual</div>
      <div class="sub">the eye</div>
    </div>
    <img class="feat-img img-right"
         src="https://cdn.jsdelivr.net/gh/tabler/tabler-icons/icons/eye.svg"
         alt="eye illustration">
  </div>

  <!-- 2. SEO – ikon di kiri -->
  <div class="feature-row">
    <img class="feat-img img-left"
         src="https://cdn.jsdelivr.net/gh/tabler/tabler-icons/icons/hand-pointer.svg"
         alt="hand illustration">
    <div class="pill line-left text-lg-end text-center ms-lg-5">
      <div class="title">SEO</div>
      <div class="sub">the touch</div>
    </div>
  </div>

  <!-- 3. Storytelling – ikon di kanan -->
  <div class="feature-row">
    <div class="pill line-right text-lg-start text-center">
      <div class="title">Storytelling</div>
      <div class="sub">the ear</div>
    </div>
    <img class="feat-img img-right"
         src="https://cdn.jsdelivr.net/gh/tabler/tabler-icons/icons/ear.svg"
         alt="ear illustration">
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
