<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elden — Stop making Contents, Start making Connection</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- The Seasons font (update src to your local files or CDN) -->
  <style>
    /* If using Laravel, swap url(...) with {{ asset('fonts/...') }} */
    @font-face {
      font-family: "The Seasons";
      src: url("/fonts/TheSeasons-Regular.woff2") format("woff2"),
           url("/fonts/TheSeasons-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "The Seasons";
      src: url("/fonts/TheSeasons-Bold.woff2") format("woff2"),
           url("/fonts/TheSeasons-Bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-dark: #0b0c10;
      --text-muted: #b8c0cc;
      --text-dim: #8b93a6;
      --accent: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: "The Seasons", Georgia, serif;
      min-height: 100vh;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Background image resembling a networked world map */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("https://images.unsplash.com/photo-1462332420958-a05d1e002413?q=80&w=1600&auto=format&fit=crop") center/cover no-repeat;
      opacity: .45; /* was .28 — make bg a bit brighter */
      filter: contrast(110%) saturate(90%);
    }

    /* vignette + top gradient for depth */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      /* Lighten the overlays for better visibility */
      background:
        linear-gradient(rgba(2,6,23,.22), rgba(2,6,23,.22)), /* global soft darken */
        radial-gradient(1100px 520px at 50% 30%, rgba(0,0,0,.18), rgba(0,0,0,.65)),
        linear-gradient(180deg, rgba(2,6,23,.6) 0%, rgba(2,6,23,.08) 35%, rgba(2,6,23,.6) 100%);
      pointer-events: none;
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: .6rem;
      z-index: 3;
      opacity: .95;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #0ea5e9;
      color: #00111b;
      font-weight: 700;
      font-size: .9rem;
      box-shadow: 0 6px 24px rgba(14,165,233,.35);
    }

    .brand-name { letter-spacing: .08em; font-weight: 700; font-size: .95rem; }

    .hero-content { position: relative; z-index: 3; }

    .kicker {
      text-align: center;
      font-size: clamp(18px, 2vw, 22px);
      color: var(--text-muted);
      margin-bottom: .35rem;
    }

    .h1-contents {
      text-align: center;
      font-size: clamp(48px, 9vw, 108px);
      line-height: .95;
      margin: 0;
      letter-spacing: .01em;
    }

    .h1-connection {
      text-align: center;
      font-size: clamp(58px, 12vw, 132px);
      line-height: .9;
      margin: 0 0 .75rem 0;
      letter-spacing: .005em;
    }

    .subcopy {
      text-align: center;
      color: var(--text-dim);
      max-width: 880px;
      margin-inline: auto;
      font-size: clamp(14px, 1.6vw, 18px);
    }

    /* Floating avatars (decorative) */
    .float-ava {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #0b1220;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      overflow: hidden;
      z-index: 3;
      animation: float 8s ease-in-out infinite;
    }
    .float-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .float-ava.badge::after{
      content: "";
      position: absolute;
      right: -2px; bottom: -2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ef4444;
      border: 2px solid #0b1220;
    }

    .ava-1 { top: 22%; right: 24%; animation-delay: 0s; }
    .ava-2 { bottom: 14%; right: 10%; animation-delay: 1.2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) }
      50% { transform: translateY(-10px) }
    }

    /* Small helper for tight containers */
    .container-narrow { max-width: 1200px; }

    /* Mobile tweaks for spacing */
    @media (max-width: 576px) {
      .brand { left: 16px; top: 20px; }
      .float-ava { width: 44px; height: 44px; }
      .ava-1 { right: 14%; }
      .ava-2 { right: 6%; }
    }
  </style>
</head>

<body>
  <header class="hero">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">E</div>
      <div class="brand-name">Elden</div>
    </div>

    <div class="hero-content container container-narrow">
      <div class="kicker">Stop making</div>
      <h1 class="h1-contents">Contents</h1>
      <div class="kicker mt-1">Start making</div>
      <h1 class="h1-connection">Connection</h1>
      <p class="subcopy px-3 px-md-0">
        Using our growth formula, we turn creativity into conversions. Content &amp; ad strategies designed for maximum ROAS.
      </p>
    </div>

    <!-- Floating avatars -->
    <div class="float-ava ava-1">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=256&auto=format&fit=crop" alt="avatar" />
    </div>
    <div class="float-ava ava-2 badge">
      <img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?q=80&w=256&auto=format&fit=crop" alt="avatar" />
    </div>
  </header>

  <!-- Bootstrap JS (optional if you need interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
