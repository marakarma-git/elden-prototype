<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cards with Individual Sliders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{ --radius:28px; }
    body{ background:#f7f7f9; font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif; }
    .card-col{ margin-bottom:2rem; }
    .tile{
      border:0; background:transparent; width:100%; max-width: 390px; margin-inline:auto;
    }
    .img-shell{
      position:relative; overflow:hidden; border-radius:var(--radius);
      box-shadow:0 10px 26px rgba(0,0,0,.12); aspect-ratio: 9/11; background:#ddd;
    }
    .img-shell .carousel, .img-shell .carousel-inner, .img-shell .carousel-item{ height:100%; }
    .img-shell img{
      width:100%; height:100%; object-fit:cover; display:block;
      transform:scale(1.01); transition:transform .45s ease;
    }
    .img-shell:hover img{ transform:scale(1.05); }
    /* Tombol panah PNG pojok kanan bawah */
    .arrow-btn{
      position:absolute; right:14px; bottom:14px; width:46px; height:46px; border-radius:50%;
      display:grid; place-items:center; background:rgba(255,255,255,.92);
      border:1px solid rgba(0,0,0,.08); backdrop-filter:blur(4px);
      box-shadow:0 8px 18px rgba(0,0,0,.15); transition:transform .3s ease, background .3s ease;
      z-index:5;
    }
    .arrow-btn:hover{ transform:translateY(-2px); background:#fff; }
    .arrow-btn img{ width:20px; height:20px; }
    .tile-title{ margin-top:.9rem; font-weight:600; font-size:clamp(1.05rem,1vw + .8rem,1.25rem); }
    .tile-sub{ color:#6b7280; font-size:.95rem; }
    /* Sembunyikan kontrol default (tetap aksesibel dengan keyboard/screenreader) */
    .carousel-control-prev, .carousel-control-next{ display:none; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

      <!-- KARTU 1 -->
      <div class="col card-col">
        <article class="tile">
          <div class="img-shell">
            <div id="carA" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3500">
              <div class="carousel-inner">
                <!-- random Unsplash (food/restaurant). "sig" memastikan variasi -->
                <div class="carousel-item active">
                  <img src="https://source.unsplash.com/800x1000/?restaurant,food&sig=11" alt="Amanaia 1">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?cafe,interior&sig=12" alt="Amanaia 2">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?chef,cuisine&sig=13" alt="Amanaia 3">
                </div>
              </div>
            </div>
            <!-- tombol panah PNG -->
            <a href="#" class="arrow-btn" data-target="#carA" aria-label="Next Amanaia">
              <img src="arrow-right.png" alt="Next">
            </a>
          </div>
          <h3 class="tile-title">Amanaia</h3>
          <div class="tile-sub">Food and Beverages</div>
        </article>
      </div>

      <!-- KARTU 2 -->
      <div class="col card-col">
        <article class="tile">
          <div class="img-shell">
            <div id="carB" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3700">
              <div class="carousel-inner">
                <!-- random Unsplash (hotel/travel/building) -->
                <div class="carousel-item active">
                  <img src="https://source.unsplash.com/800x1000/?hotel,building&sig=21" alt="Marbella 1">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?resort,palm&sig=22" alt="Marbella 2">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?apartment,architecture&sig=23" alt="Marbella 3">
                </div>
              </div>
            </div>
            <a href="#" class="arrow-btn" data-target="#carB" aria-label="Next Marbella">
              <img src="arrow-right.png" alt="Next">
            </a>
          </div>
          <h3 class="tile-title">Marbella Place</h3>
          <div class="tile-sub">Hotel and Travel</div>
        </article>
      </div>

      <!-- KARTU 3 -->
      <div class="col card-col">
        <article class="tile">
          <div class="img-shell">
            <div id="carC" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3900">
              <div class="carousel-inner">
                <!-- random Unsplash (car/technology/ev) -->
                <div class="carousel-item active">
                  <img src="https://source.unsplash.com/800x1000/?car,technology&sig=31" alt="Polytron 1">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?electric-car,ev&sig=32" alt="Polytron 2">
                </div>
                <div class="carousel-item">
                  <img src="https://source.unsplash.com/800x1000/?dashboard,auto&sig=33" alt="Polytron 3">
                </div>
              </div>
            </div>
            <a href="#" class="arrow-btn" data-target="#carC" aria-label="Next Polytron">
              <img src="arrow-right.png" alt="Next">
            </a>
          </div>
          <h3 class="tile-title">Polytron</h3>
          <div class="tile-sub">Technology</div>
        </article>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tombol panah PNG menggerakkan slider terdekat (berdasarkan data-target)
    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        const target = btn.getAttribute('data-target');
        const el = document.querySelector(target);
        if (!el) return;
        const instance = bootstrap.Carousel.getOrCreateInstance(el);
        instance.next();
      });
    });
  </script>
</body>
</html>
