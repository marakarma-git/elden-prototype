<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Happy Customer – Logo Slider</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Tiny Slider -->
  <link href="https://cdn.jsdelivr.net/npm/tiny-slider@2.9.4/dist/tiny-slider.css" rel="stylesheet"/>

  <style>
    body{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";}
    .section-pad{padding: 72px 0}
    .title{
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: .5px;
    }
    .subtitle{color:#c33; font-size: .95rem}

    /* Logo slider */
    .logo-item{
      height: 70px;                /* tinggi bar logo */
      display: grid; place-items: center;
      padding: 8px 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    .logo-item img{
      max-height: 52px;            /* sesuaikan agar proporsional */
      max-width: 100%;
      filter: grayscale(100%);
      opacity: .85;
      transition: filter .2s ease, opacity .2s ease, transform .2s ease;
    }
    .logo-item:hover img{filter: grayscale(0%); opacity: 1; transform: translateY(-2px);}
    .tns-outer{position: relative}
    .tns-nav{display:none}         /* sembunyikan dots */
    .tns-controls{
      position:absolute; inset: 0 0 auto 0; height:0; pointer-events:none;
    }
    .tns-controls [data-controls]{
      pointer-events:auto;
      position:absolute; top:-36px; right:0;
      border:0; background:#000; color:#fff; width:36px; height:36px; border-radius:10px;
      display:grid; place-items:center; opacity:.85
    }
    .tns-controls [data-controls="prev"]{right:44px}
    .tns-controls [data-controls]:hover{opacity:1}
  </style>
</head>
<body>

  <!-- Header sederhana (opsional) -->
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">BrandSite</a>
    </div>
  </nav>

  <!-- Our Happy Customer -->
  <section class="section-pad">
    <div class="container">
      <div class="text-center mb-4">
        <h2 class="title">Our Happy Customer</h2>
      </div>

      <!-- Slider wrapper -->
      <div class="logo-slider">
        <!-- Tiap item = 1 logo -->
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/111111.png&text=Aesthete" alt="Aesthete logo">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/dd2222.png&text=POLYTRON" alt="Polytron logo">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/1a73e8.png&text=MACS" alt="MACS logo">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/333333.png&text=amanaia" alt="amanaia logo">
        </div>
        <!-- Tambah sebanyak yang kamu mau -->
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/111111.png&text=Client+5" alt="Client 5">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/444444.png&text=Client+6" alt="Client 6">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/999999.png&text=Client+7" alt="Client 7">
        </div>
        <div class="logo-item">
          <img src="https://dummyimage.com/240x80/ffffff/222222.png&text=Client+8" alt="Client 8">
        </div>
      </div>

      <p class="text-center mt-3 subtitle">(this part is an example. And will be a slideshow of brands)</p>
    </div>
  </section>

  <!-- Footer mini -->
  <footer class="py-4 border-top">
    <div class="container text-center small text-muted">
      © 2025 Your Company
    </div>
  </footer>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tiny-slider@2.9.4/dist/min/tiny-slider.js"></script>
  <script>
    // Inisialisasi tiny-slider
    const slider = tns({
      container: '.logo-slider',
      items: 6,          // default desktop
      gutter: 20,
      mouseDrag: true,
      swipeAngle: false,
      speed: 400,
      autoplay: true,
      autoplayButtonOutput: false,
      autoplayTimeout: 1600,
      autoplayHoverPause: true,
    //   controls: false,
      controls: true,
      nav: false,
      loop: true,
      responsive: {
        0:   { items: 2, gutter: 14 },
        480: { items: 3, gutter: 16 },
        768: { items: 4, gutter: 18 },
        992: { items: 5, gutter: 20 },
        1200:{ items: 6, gutter: 24 }
      }
    });
  </script>
</body>
</html>
