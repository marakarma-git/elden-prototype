<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discuss your growth plan</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- The Seasons (lokal, boleh tetap pakai seperti sebelumnya) -->
<style>
  @font-face{
    font-family:"The Seasons";
    src:url("/fonts/TheSeasons-Regular.woff2") format("woff2"),
        url("/fonts/TheSeasons-Regular.woff") format("woff");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"The Seasons";
    src:url("/fonts/TheSeasons-Bold.woff2") format("woff2"),
        url("/fonts/TheSeasons-Bold.woff") format("woff");
    font-weight:700; font-style:normal; font-display:swap;
  }

  /* HERO */
  .hero{
    min-height:62vh; color:#eef3ff; position:relative; overflow:hidden;
    /* Background acak dari internet (Unsplash) */
    background:
      radial-gradient(900px 520px at 6% -10%, rgba(120,160,230,.35), transparent 60%),
      radial-gradient(900px 520px at 96% 110%, rgba(10,30,70,.55), transparent 60%),
      url("https://source.unsplash.com/1600x900/?abstract,gradient,dark") center/cover no-repeat;
  }
  .hero::before{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(3,9,20,.15), rgba(3,9,20,.35)); pointer-events:none; }

  .hero-title{
    font-family:"The Seasons","Playfair Display",serif; font-weight:700;
    line-height:.92; letter-spacing:.2px; font-size:clamp(2.6rem,9vw,6.6rem);
  }
  .hero-sub{ color:#d5defc; font-size:clamp(.95rem,1.5vw,1.05rem); max-width:78ch; }

  .pb-for-bottom{ padding-bottom:96px; } /* supaya teks tak ketutup bar bawah */

  /* Bottom bar */
  .hero-bottom{ position:absolute; left:0; right:0; bottom:0; padding:.9rem 0; z-index:2; }

  /* Brand (logo dari internet via dummyimage PNG) */
  .brand img{ height:38px; }

  /* Ikon sosmed TANPA ring (PNG dari internet) */
  .social a{ display:inline-flex; align-items:center; justify-content:center; }
  .social img{
    width:28px; height:28px; object-fit:contain; display:block;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.35));
    transition: transform .2s ease, opacity .2s ease;
  }
  .social a:hover img{ transform:translateY(-2px) scale(1.05); opacity:.95; }

  @media (max-width:575.98px){
    .brand img{ height:34px; }
    .social img{ width:26px; height:26px; }
    .pb-for-bottom{ padding-bottom:90px; }
  }
</style>
</head>
<body class="bg-dark">

<section class="hero d-flex align-items-start align-items-lg-center">
  <div class="container py-5 pb-for-bottom position-relative">
    <div class="row">
      <div class="col-12 col-lg-11">
        <h1 class="hero-title">Discuss your growth plan!</h1>
        <p class="hero-sub mb-0">
          We’ll be happy to assist you in developing a marketing plan that aligns with your goals and drives measurable results
        </p>
      </div>
    </div>

    <!-- bottom bar -->
    <div class="hero-bottom">
      <div class="container">
        <div class="d-flex align-items-center justify-content-between">
          <!-- brand kiri (PNG dari internet) -->
          <div class="brand d-flex align-items-center gap-2">
            <img src="https://dummyimage.com/180x48/ffffff/0a0a0a.png&text=Elden" alt="Elden">
            <span class="fw-semibold">Elden</span>
          </div>
          <!-- sosmed kanan (PNG dari internet, warna putih) -->
          <div class="social d-flex align-items-center gap-3">
            <a href="https://wa.me/6281234567890" target="_blank" rel="noopener" aria-label="WhatsApp">
              <img src="https://img.icons8.com/ios-filled/50/FFFFFF/whatsapp.png" alt="WhatsApp" loading="lazy">
            </a>
            <a href="https://instagram.com/yourprofile" target="_blank" rel="noopener" aria-label="Instagram">
              <img src="https://img.icons8.com/ios-filled/50/FFFFFF/instagram-new.png" alt="Instagram" loading="lazy">
            </a>
            <a href="mailto:hello@elden.id" aria-label="Email">
              <img src="https://img.icons8.com/ios-filled/50/FFFFFF/new-post.png" alt="Email" loading="lazy">
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
