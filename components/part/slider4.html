<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Clients Slider</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  /* --- SECTION STYLE (opsional) --- */
  .clients-section{
    background: radial-gradient(900px 500px at 10% -10%, #47608f40, transparent 60%),
                radial-gradient(900px 500px at 100% 110%, #0b1c3740, transparent 60%),
                #0f1a2b;
    color:#eaf0ff;
  }
  .clients-title{
    font-family: "The Seasons", "Playfair Display", serif;
    font-weight:700;
    letter-spacing:.2px;
  }

  /* --- SLIDER CORE --- */
  .logo-slider{
    position: relative;
    overflow: hidden;
  }
  .logo-track{
    display: flex;
    align-items: center;
    gap: clamp(2rem, 6vw, 4rem);
    /* durasi geser (ubah sesuai kebutuhan) */
    animation: scrollX 22s linear infinite;
  }
  /* duplikasi baris agar seamless */
  .logo-track > .logo-item{ flex: 0 0 auto; }

  /* Ukuran & efek logo */
  .logo-item img{
    height: 48px;               /* tinggi logo seragam */
    width: auto;
    filter: grayscale(100%) brightness(1.2) contrast(1.05);
    opacity: .85;
    transition: filter .25s ease, opacity .25s ease, transform .25s ease;
  }
  .logo-item:hover img{
    filter: grayscale(0%) brightness(1) contrast(1);
    opacity: 1;
    transform: translateY(-2px);
  }

  /* Pause saat hover area slider */
  .logo-slider:hover .logo-track{
    animation-play-state: paused;
  }

  /* Responsif: tinggi logo naik di layar besar */
  @media (min-width: 992px){
    .logo-item img{ height: 60px; }
  }

  /* Keyframes: geser horizontal */
  @keyframes scrollX{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); } /* karena kita duplikasi isi jadi 50% */
  }
</style>
</head>
<body class="bg-dark">

<section class="clients-section py-5">
  <div class="container">
    <div class="d-flex align-items-end justify-content-between mb-3">
      <h2 class="clients-title m-0">Our Clients</h2>
      <small class="text-light opacity-75">Trusted by brands</small>
    </div>

    <!-- SLIDER -->
    <div class="logo-slider py-3">
      <!-- Track berisi 2x kumpulan logo yang sama (untuk loop mulus) -->
      <div class="logo-track">

        <!-- Kumpulan A -->
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2022.svg" alt="Brand A"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Brand B"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Brand C"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Spotify_logo_without_text.svg" alt="Brand D"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Brand E"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/IBM_logo.svg" alt="Brand F"></a>

        <!-- Kumpulan B (duplikasi persis A) -->
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Logo_TV_2022.svg" alt="Brand A"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Brand B"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Brand C"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Spotify_logo_without_text.svg" alt="Brand D"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Brand E"></a>
        <a href="#" class="logo-item"><img src="https://upload.wikimedia.org/wikipedia/commons/5/51/IBM_logo.svg" alt="Brand F"></a>

      </div>
    </div>

    <!-- OPTIONAL: teks kecil -->
    <p class="text-center text-light opacity-75 mb-0">We partner with startups, SMEs, and enterprises.</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
