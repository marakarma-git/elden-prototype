<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Clients Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* CSS Kustom untuk slider klien */
        #client-section {
            padding: 60px 0;
            background-color: #f8f9fa; /* Warna latar belakang abu-abu muda */
        }

        .client-logo-wrapper {
            /* Memaksa setiap logo memiliki tinggi yang sama agar rapi */
            height: 80px; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .client-logo {
            max-width: 100%;
            max-height: 60px; /* Batas tinggi maks logo */
            height: auto;
            /* Efek grayscale dan transisi */
            filter: grayscale(100%);
            opacity: 0.7;
            transition: all 0.3s ease-in-out;
        }

        .client-logo:hover {
            /* Efek saat di-hover */
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.1);
        }

        /* Mengatur panah navigasi carousel agar terlihat di latar putih */
        .carousel-dark .carousel-control-prev-icon,
        .carousel-dark .carousel-control-next-icon {
            background-color: #ddd; /* Memberi sedikit latar belakang pada panah */
            border-radius: 50%;
            background-size: 60%;
        }
    </style>
</head>
<body>

    <section id="client-section">
        <div class="container">
            <h2 class="text-center mb-5">Our Happy Customer</h2>

            <div id="clientCarousel" class="carousel slide carousel-dark" data-bs-ride="carousel">
                
                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <div class="row">
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=Aesthete" class="client-logo" alt="Aesthete Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=POLYTRON" class="client-logo" alt="Polytron Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=MACS" class="client-logo" alt="MACS Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=amanaia" class="client-logo" alt="amanaia Logo">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="carousel-item">
                        <div class="row">
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=Client+5" class="client-logo" alt="Client 5 Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=Client+6" class="client-logo" alt="Client 6 Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=Client+7" class="client-logo" alt="Client 7 Logo">
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="client-logo-wrapper">
                                    <img src="https://via.placeholder.com/150x60?text=Client+8" class="client-logo" alt="Client 8 Logo">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    </div> <button class="carousel-control-prev" type="button" data-bs-target="#clientCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#clientCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>

            </div> </div> </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
